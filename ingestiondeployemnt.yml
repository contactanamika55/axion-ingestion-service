apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ingestion-service
  namespace: default
  labels:
    app.kubernetes.io/name: axion-ingestion-service
    app.kubernetes.io/part-of: axion-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: axion-ingestion-service
  template:
    metadata:
      labels:
        app: axion-ingestion-service
    spec:
      # Private GHCR registry secret (if repo/package is private)
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: ingestion-service
          image: ghcr.io/asign796/axion-ingestion-service:c3e5f7f
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Resource limits to prevent OOMKilled and CPU starvation
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Health checks to ensure traffic only reaches healthy pods
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # Environment variables & secrets mapping
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: axion-db-secrets
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: axion-ingestion-service
  namespace: default
  labels:
    app.kubernetes.io/name: axion-ingestion-service
spec:
  type: ClusterIP
  selector:
    app: axion-ingestion-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP